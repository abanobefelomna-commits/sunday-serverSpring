spring.application.name=sunday-school-api
spring.config.import=optional:file:../../sunday-school-api/.env[.properties],optional:file:.env[.properties]
server.port=${PORT:3001}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:true}
auth.jwt.secret=${JWT_SECRET:}
auth.jwt.expires-seconds=${JWT_EXPIRES_SECONDS:86400}
auth.refresh.ttl-days=${REFRESH_TTL_DAYS:7}
auth.otp.secret=${OTP_SECRET:}
auth.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
auth.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
auth.mail.from=${MAIL_FROM:}
auth.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:uploads}
